name: Build AnyCPU plugin

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      hdt_version:
        description: "HDT version to build against"
        required: true
        default: "1.58.3"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET Framework 4.7.2 Developer Pack
        shell: powershell
        run: choco install netfx-4.7.2-devpack -y --no-progress

      - name: Download HDT
        shell: powershell
        run: |
          $version = "${{ inputs.hdt_version }}"
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.58.3" }
          $url = "https://github.com/HearthSim/HDT-Releases/releases/download/v$version/HearthstoneDeckTracker-$version-full.nupkg"
          Invoke-WebRequest -Uri $url -OutFile hdt.zip
          Expand-Archive hdt.zip -DestinationPath hdt
          $hdtExe = Get-ChildItem hdt -Recurse -Filter "HearthstoneDeckTracker.exe" | Select-Object -First 1
          if (-not $hdtExe) { throw "HearthstoneDeckTracker.exe not found in release package" }
          "HDT_INSTALL_DIR=$($hdtExe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        shell: powershell
        run: .\build.ps1 -Configuration Release -HDTInstallDir "$env:HDT_INSTALL_DIR"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: HdtCollectionExporter-AnyCPU
          path: src/HdtCollectionExporter/bin/AnyCPU/Release/HdtCollectionExporter.dll
          if-no-files-found: error
